# typecheck, lint, test, build を実行します。
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint-test-build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci

    - run: npm run typecheck

    - run: npm run lint

    - run: npm test

    - run: npm run build

    - run: npx playwright install --with-deps chromium

    - run: npm run test:e2e

  docker:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # README の「パッと実行してみたい」の手順で起動できることを確認します。
    - run: docker compose up --build --detach --wait

    - run: curl --fail --silent --retry 10 --retry-delay 1 --retry-all-errors http://localhost:5173/vue-fullcalendar-study/

    - run: docker compose run --rm -T app npm test

    - if: always()
      run: docker compose down
